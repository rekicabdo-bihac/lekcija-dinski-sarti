<!doctype html><html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103e32"><title>Dinski šarti – interaktivna lekcija</title><style>:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#f9f4dc;background:#102b24}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#174c3d,#0e3028);padding:17px 12px;text-align:center;border-bottom:3px solid #e9c56c}h1{font-size:clamp(23px,5vw,35px);margin:0;color:#ffe3a0}header p{margin:5px 0;color:#e7d9b6;font-size:14px}.wrap{max-width:760px;margin:auto;padding:12px}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tabs button,.btn,.opt,.tile{border:1px solid #b6a66e;border-radius:13px;background:#20584b;color:#fff;padding:13px 8px;font-weight:700;font-size:15px;min-height:53px;touch-action:manipulation}.tabs button.active{background:#e7c369;color:#1e3025}.tabs button:last-child{grid-column:1/-1}.stats{display:flex;justify-content:space-between;gap:10px;margin:13px 0;font-weight:700}.progress{height:9px;border-radius:9px;background:#496b5e;overflow:hidden}.progress span{display:block;background:#e7c369;height:100%;transition:width .2s}main{margin-top:12px;border:1px solid #b6a66e;border-radius:20px;padding:16px;background:#143c32;min-height:300px}h2{margin:0 0 12px;font-size:23px}.muted{color:#e1d6ba}.card{background:#215447;border:1px solid #77917c;padding:16px;border-radius:16px;margin:12px 0;line-height:1.55}.big{font-size:25px;font-weight:800;color:#ffe4a2}.options{display:grid;gap:9px;margin-top:16px}.opt{text-align:left;background:#255d4f;min-height:55px}.opt.correct,.tile.correct{background:#247b46;border-color:#b7f3bf}.opt.wrong,.tile.wrong{background:#8b3535;border-color:#f7aaaa}.row{display:flex;gap:9px;margin-top:12px}.row>*{flex:1}.btn{background:#d9b55e;color:#183b30}.btn.secondary{background:#24564a;color:white}.feedback{min-height:27px;font-weight:750;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{font-size:14px}.tile.selected{outline:3px solid #f3d67e}.pill{display:inline-block;background:#e7c369;color:#20382c;border-radius:99px;padding:5px 10px;font-weight:800}.sequence{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.sequence span{background:#2c6858;border:1px solid #b3a66d;border-radius:9px;padding:8px;font-weight:700}.tiny{font-size:13px;color:#e8d5aa}button:disabled{opacity:.55}footer{text-align:center;padding:16px;color:#d9c897}@media(max-width:360px){.tabs button{font-size:13px;padding:9px 4px}.wrap{padding:8px}main{padding:12px}} </style></head><body><header><h1>🌳 DINSKI ŠARTI</h1><p>Interaktivna mektebska lekcija · Pripremio Abdo ef. Rekić</p></header><div class="wrap"><nav class="tabs" id="tabs"></nav><div class="stats"><span id="score">Bodovi: 0</span><span id="count"></span></div><div class="progress"><span id="bar"></span></div><main id="screen" aria-live="polite"></main><footer>Uči → Spoji → Složi redom → Šta nedostaje? → Prepoznaj → Brzi izazov → Završni ispit</footer></div><script>
'use strict';
const groups=[{n:'Imanski šarti',count:6,short:'imanskih',detail:'Šest imanskih šarta.'},{n:'Islamski šarti',count:5,short:'islamskih',detail:'Pet islamskih šarta.'},{n:'Abdeski šarti',count:4,short:'abdeska',detail:'Četiri abdeska šarta.'},{n:'Tejemumski šarti',count:3,short:'tejemumska',detail:'Tri tejemumska šarta.'},{n:'Gusulski šarti',count:3,short:'gusulska',detail:'Tri gusulska šarta.'},{n:'Namaski šarti',count:12,short:'namaskih',detail:'Dvanaest namaskih šarta: šest namaskih uvjeta i šest namaskih ruknova.'}];
const cards=[{front:'Din',back:'Din znači vjera.'},{front:'Šart',back:'Šart znači uvjet.'},{front:'Dinski šarti',back:'Uvjeti ili radnje koje treba ispuniti svaka punoljetna osoba za potpunost vjerovanja.'},{front:'Koliko ima dinskih šarta?',back:'Ukupno 33 dinska šarta.'},...groups.map(g=>({front:g.n,back:g.detail})),{front:'6 + 5 + 4 + 3 + 3 + 12',back:'Zbir je 33 dinska šarta.'},{front:'Ihsan',back:'Najveći stupanj svijesti o Uzvišenom Allahu: da Ga vidimo, jer ako mi Njega ne vidimo, On vidi nas.'},{front:'Šta motivira ihsan?',back:'Ihsan nas motivira na ustrajnost u izvršavanju dinskih šarta.'},{front:'Namaski uvjeti',back:'Šest namaskih uvjeta – pripreme za namaz.'},{front:'Namaski ruknovi',back:'Šest namaskih ruknova – sastavni dijelovi namaza.'}];
const definitions=[['Din','Vjera'],['Šart','Uvjet'],['Dinski šarti','Uvjeti ili radnje za potpunost vjerovanja'],['Ihsan','Svijest da nas Uzvišeni Allah vidi'],['Namaski uvjeti','Pripreme za namaz'],['Namaski ruknovi','Sastavni dijelovi namaza']];
const quiz=[];function add(q,correct,wrong,kind='general'){quiz.push({q,correct,wrong,kind})}
add('Šta znači riječ „din“?','Vjera',['Uvjet','Radnja','Namaz']);add('Šta znači riječ „šart“?','Uvjet',['Vjera','Stupanj','Radnja']);add('Šta su dinski šarti?','Uvjeti ili radnje koje treba ispuniti svaka punoljetna osoba za potpunost vjerovanja.',['Samo nazivi pet dnevnih namaza.','Samo radnje koje se obavljaju u namazu.','Samo preporučena djela koja nisu uvjeti.']);add('Koliko ukupno ima dinskih šarta?','33',['32','34','30'],'number');
for(const g of groups){let nums=[3,4,5,6,12,33].filter(x=>x!==g.count);add('Koliko ima '+g.n.toLowerCase()+'?',String(g.count),nums.slice(0,3).map(String),'number');add('Kojoj skupini pripada broj '+g.count+'?',g.n,groups.filter(x=>x.n!==g.n&&x.count!==g.count).slice(0,3).map(x=>x.n),'group');add('Koja tvrdnja o skupini „'+g.n+'“ je tačna?',g.detail,groups.filter(x=>x.n!==g.n).slice(0,3).map(x=>x.detail),'meaning')}
add('Koliko ima imanskih i islamskih šarta zajedno?','11',['10','12','13'],'number');add('Koliko ima abdeskih i gusulskih šarta zajedno?','7',['6','8','9'],'number');add('Koliko ima tejemumskih i gusulskih šarta zajedno?','6',['5','7','8'],'number');add('Koliko ima namaskih uvjeta?','6',['5','4','12'],'number');add('Koliko ima namaskih ruknova?','6',['5','4','12'],'number');add('Koliko ima namaskih šarta ukupno?','12',['6','11','13'],'number');add('Kako se dijele namaski šarti?','Na šest namaskih uvjeta i šest namaskih ruknova.',['Na pet uvjeta i sedam ruknova.','Na četiri uvjeta i osam ruknova.','Na sedam uvjeta i pet ruknova.']);add('Šta znači ihsan prema lekciji?','Da smo svjesni Uzvišenog Allaha kao da Ga vidimo; iako Ga mi ne vidimo, On vidi nas.',['Da se oslanjamo samo na vlastite postupke.','Da činimo dobra djela samo kad nas ljudi gledaju.','Da o svojim djelima razmišljamo samo pred drugima.']);add('Na šta nas ihsan motivira?','Na ustrajnost u izvršavanju dinskih šarta.',['Na odustajanje od izvršavanja šarta.','Na zanemarivanje vjerskih uvjeta.','Na izvršavanje šarta samo povremeno.']);add('Koja je tačna podjela svih 33 dinska šarta?','6 imanskih + 5 islamskih + 4 abdeska + 3 tejemumska + 3 gusulska + 12 namaskih',['6 imanskih + 5 islamskih + 3 abdeska + 4 tejemumska + 3 gusulska + 12 namaskih','6 imanskih + 5 islamskih + 4 abdeska + 3 tejemumska + 4 gusulska + 11 namaskih','5 imanskih + 6 islamskih + 4 abdeska + 3 tejemumska + 3 gusulska + 12 namaskih']);
add('Koja skupina ima četiri šarta?','Abdeski šarti',['Gusulski šarti','Tejemumski šarti','Islamski šarti'],'group');add('Koja skupina ima pet šarta?','Islamski šarti',['Imanski šarti','Abdeski šarti','Namaski šarti'],'group');add('Koja skupina ima dvanaest šarta?','Namaski šarti',['Imanski šarti','Islamski šarti','Abdeski šarti'],'group');add('Koja je razlika između namaskih uvjeta i ruknova?','Uvjeti su pripreme za namaz, a ruknovi sastavni dijelovi namaza.',['Uvjeti su sastavni dijelovi namaza, a ruknovi pripreme.','Uvjeti i ruknovi su samo dva naziva za abdeske šarte.','Uvjeti i ruknovi se odnose samo na tejemum.']);
const stages=['NAUČI','SPOJI','SLOŽI REDOM','ŠTA NEDOSTAJE?','PREPOZNAJ PO ZNAČENJU','BRZI IZAZOV','ZAVRŠNI ISPIT'];let stage=0,score=0,index=0,items=[],locked=false,pending=null,selected=null,donePairs=new Set(),order=[],expected=[],soundCtx=null;const $=x=>document.getElementById(x);const shuffle=a=>[...a].sort(()=>Math.random()-.5);function beep(ok){try{soundCtx=soundCtx||new(window.AudioContext||window.webkitAudioContext)();soundCtx.resume();let o=soundCtx.createOscillator(),g=soundCtx.createGain();o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(ok?660:250,soundCtx.currentTime);if(ok)o.frequency.setValueAtTime(880,soundCtx.currentTime+.12);else o.frequency.setValueAtTime(170,soundCtx.currentTime+.13);g.gain.setValueAtTime(.12,soundCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,soundCtx.currentTime+.29);o.connect(g);g.connect(soundCtx.destination);o.start();o.stop(soundCtx.currentTime+.3)}catch(e){}}function points(ok){score+=ok?10:-3;$('score').textContent='Bodovi: '+score;beep(ok)}function progress(n,total){$('count').textContent=n+' / '+total;$('bar').style.width=Math.max(0,Math.min(100,100*n/total))+'%'}function clear(){if(pending)clearTimeout(pending);pending=null;locked=false;$('screen').innerHTML=''}function el(tag,cls,text,parent){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;(parent||$('screen')).append(x);return x}function btn(text,fn,cls='btn'){let b=el('button',cls,text);b.onclick=fn;return b}function start(s){stage=s;index=0;score=0;selected=null;donePairs=new Set();order=[];expected=[];$('score').textContent='Bodovi: 0';document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',i===s));clear();if(s===0)items=cards;if(s===1)items=shuffle(definitions);if(s===2)items=groups;if(s===3)items=shuffle(groups);if(s===4)items=shuffle(quiz.filter(q=>q.kind==='meaning'||q.kind==='group'));if(s===5)items=shuffle(quiz).slice(0,12);if(s===6)items=shuffle(quiz).slice(0,30);render()}
function next(){index++;locked=false;render()}function render(){clear();el('h2','',stages[stage]);if(stage===0)return learn();if(stage===1)return match();if(stage===2)return arrange();if(stage===3)return missing();return question()}
function learn(){if(index>=items.length)return finish();progress(index+1,items.length);el('p','muted','Kartica '+(index+1)+' / '+items.length);let c=el('div','card');el('div','big',items[index].front,c);el('p','',items[index].back,c);let r=el('div','row');let back=el('button','btn secondary','← Nazad',r);back.disabled=index===0;back.onclick=()=>{index--;render()};let forward=el('button','btn','Dalje →',r);forward.onclick=next}
function match(){progress(donePairs.size,items.length);el('p','muted','Dodirni pojam, a zatim njegovo značenje. Svaki tačan par nestaje iz igre.');if(donePairs.size===items.length)return finish();const choices=items.map((pair,i)=>({text:pair[0],i,side:0})).concat(items.map((pair,i)=>({text:pair[1],i,side:1})));const grid=el('div','grid');for(const x of shuffle(choices.filter(x=>!donePairs.has(x.i)))){const b=el('button','tile',x.text,grid);b.onclick=()=>{if(locked)return;if(!selected){selected={...x,b};b.classList.add('selected');return}if(selected.b===b){selected=null;b.classList.remove('selected');return}let ok=selected.i===x.i&&selected.side!==x.side;points(ok);if(ok){donePairs.add(x.i);selected.b.classList.add('correct');b.classList.add('correct');locked=true;pending=setTimeout(()=>{selected=null;locked=false;render()},650)}else{selected.b.classList.remove('selected');b.classList.add('wrong');selected=null;locked=true;pending=setTimeout(()=>{locked=false;b.classList.remove('wrong')},550)}}}}
function arrange(){progress(order.length,groups.length);el('p','muted','Složi šest skupina dinskih šarta redom kako su navedene u Ilmihalu.');const seq=el('div','sequence');order.forEach((x,i)=>el('span','',`${i+1}. ${x.n}`,seq));if(order.length===groups.length)return finish();let grid=el('div','grid');shuffle(groups.filter(x=>!order.includes(x))).forEach(x=>{let b=el('button','tile',x.n,grid);b.onclick=()=>{if(locked)return;let ok=x===groups[order.length];points(ok);b.classList.add(ok?'correct':'wrong');if(ok){order.push(x);locked=true;pending=setTimeout(()=>{locked=false;render()},650)}else{locked=true;pending=setTimeout(()=>{locked=false;b.classList.remove('wrong')},550)}}})}
function missing(){if(index>=items.length)return finish();progress(index+1,items.length);let g=items[index];el('p','muted','Koji broj nedostaje?');let seq=el('div','sequence');groups.forEach(x=>el('span','',x===g?'❓':x.count+' '+x.short,seq));const opts=shuffle([g.count,...[3,4,5,6,12,33].filter(n=>n!==g.count)].slice(0,4));answerButtons('Koji broj pripada skupini „'+g.n+'“?',String(g.count),opts.map(String),true)}
function question(){if(index>=items.length)return finish();progress(index+1,items.length);let q=items[index];answerButtons(q.q,q.correct,shuffle([q.correct,...q.wrong]).slice(0,4),false)}function answerButtons(title,correct,options,isMissing){el('div','card',title);let grid=el('div','options');for(let v of options){let b=el('button','opt',v,grid);b.onclick=()=>{if(locked)return;locked=true;let ok=v===correct;points(ok);b.classList.add(ok?'correct':'wrong');if(!ok){[...grid.children].find(c=>c.textContent===correct)?.classList.add('correct')}el('p','feedback',ok?'✓ Tačno!':'✗ Netačno. Tačan odgovor: '+correct);pending=setTimeout(next,1150)}}}function finish(){progress(items.length,items.length);el('div','card big','Bravo! Završio/la si etapu.');el('p','',`Osvojeni bodovi: ${score}`);btn('Ponovi etapu',()=>start(stage));if(stage<6)btn('Sljedeća etapa →',()=>start(stage+1),'btn secondary')}
const tabs=$('tabs');stages.forEach((s,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+s;b.onclick=()=>start(i);tabs.append(b)});start(0);
</script></body></html>
